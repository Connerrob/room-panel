<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0f1418; --panel: #161d23; --line: #26313a; --fg: #eef2f4; --muted: #8a99a5;
  --free: #2fb67c; --busy: #e2574c; --soon: #e6a23c; --off: #4a5560; --uf: #fa4616;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-variant-numeric: tabular-nums; overflow: hidden; cursor: none; -webkit-user-select: none; user-select: none; }
/* Laid out at 1280x800 (TSW-770/1070, TS-1070) and scaled to fit the screen. */
.sign { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0; padding: 24px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; }
.status { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.room-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.room-code { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .95; }
.room-sub { color: var(--muted); font-size: 17px; margin-top: 6px; }
.clock { text-align: right; flex-shrink: 0; }
.clock-time { font-family: var(--display); font-weight: 600; font-size: 44px; line-height: 1; }
.clock-date { color: var(--muted); font-size: 16px; margin-top: 4px; }
.state { flex: 1; border-radius: 6px; padding: 28px 32px; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: var(--free); color: #06140d; min-height: 0; transition: background-color .6s; }
.state.busy { background: var(--busy); color: #1a0705; }
.state.soon { background: var(--soon); color: #1a1003; }
.state.off { background: var(--off); color: var(--fg); }
.state-label { font-family: var(--display); font-weight: 700; font-size: 88px; line-height: .9; text-transform: uppercase; letter-spacing: .02em; }
.state-detail { font-size: 24px; font-weight: 600; }
.state-event { font-size: 22px; font-weight: 500; opacity: .85; }
.next { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.next-title { font-size: 22px; font-weight: 600; }
.next-meta { color: var(--muted); font-size: 17px; }
.schedule { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 20px 0 8px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.schedule-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 22px 12px; border-bottom: 1px solid var(--line); }
.schedule-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 28px; }
.count { color: var(--muted); font-size: 15px; }
ol { list-style: none; margin: 0; padding: 0; overflow: hidden; flex: 1; }
li { display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 13px 22px; border-bottom: 1px solid var(--line); position: relative; }
li:last-child { border-bottom: 0; }
li.past { opacity: .4; }
li.now { background: rgba(226, 87, 76, .12); }
li.now::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--busy); }
.t { font-weight: 600; font-size: 17px; line-height: 1.3; }
.t span { display: block; color: var(--muted); font-weight: 500; font-size: 15px; }
.ev-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
.ev-code { font-family: var(--display); font-weight: 600; color: var(--uf); margin-right: 6px; }
.ev-who { color: var(--muted); font-size: 15px; margin-top: 2px; }
.empty { display: block; padding: 24px 22px; color: var(--muted); font-size: 18px; }
.foot { padding: 10px 22px 4px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="sign">
  <section class="status">
    <div class="room-head">
      <div><div class="room-code" id="room">&nbsp;</div><div class="room-sub" id="sub"></div></div>
      <div class="clock"><div class="clock-time" id="clock-time"></div><div class="clock-date" id="clock-date"></div></div>
    </div>
    <div class="state off" id="state">
      <div class="state-label" id="state-label">Loading</div>
      <div class="state-detail" id="state-detail"></div>
      <div class="state-event" id="state-event"></div>
    </div>
    <div class="next" id="next" hidden>
      <div class="eyebrow">Up next</div>
      <div class="next-title" id="next-title"></div>
      <div class="next-meta" id="next-meta"></div>
    </div>
  </section>
  <section class="schedule">
    <div class="schedule-head"><h2>Today</h2><span class="count" id="count"></span></div>
    <ol id="list"></ol>
    <div class="foot" id="foot"></div>
  </section>
</main>
<script>
(function () {
  var DATA_URL = "cse-e222.json";

  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800), el = document.querySelector(".sign");
    el.style.transform = "scale(" + s + ")";
    el.style.left = (window.innerWidth - 1280 * s) / 2 + "px";
    el.style.top = (window.innerHeight - 800 * s) / 2 + "px";
  }
  window.addEventListener("resize", fit);
  fit();
  var SOON_MIN = 15, STALE_MIN = 90;
  var data = null, lastOk = 0;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(iso) { var h = +iso.substr(11, 2), m = iso.substr(14, 2); return (h % 12 || 12) + ":" + m + " " + (h >= 12 ? "PM" : "AM"); }
  function range(b) { var s = fmt(b.start), e = fmt(b.end); if (s.slice(-2) === e.slice(-2)) s = s.slice(0, -3); return s + " – " + e; }
  function mins(ms) { var m = Math.round(ms / 60000); if (m < 60) return m + " min"; var h = Math.floor(m / 60), r = m % 60; return h + " hr" + (r ? " " + r + " min" : ""); }
  function label(b) { return (b.code ? b.code + " " : "") + b.title; }
  function todayET() {
    try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" }); }
    catch (e) { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  }

  function load() {
    var x = new XMLHttpRequest();
    x.open("GET", DATA_URL + "?_=" + Date.now());
    x.onload = function () {
      if (x.status !== 200) return;
      try {
        data = JSON.parse(x.responseText);
        for (var i = 0; i < data.bookings.length; i++) { var b = data.bookings[i]; b.s = Date.parse(b.start); b.e = Date.parse(b.end); }
        lastOk = Date.now(); render();
      } catch (e) {}
    };
    x.send();
  }

  function setState(cls, l, d, e) { $("state").className = "state " + cls; $("state-label").textContent = l; $("state-detail").textContent = d; $("state-event").textContent = e; }

  function render() {
    var t = Date.now(), d = new Date();
    try {
      $("clock-time").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
      $("clock-date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric", timeZone: "America/New_York" });
    } catch (e) { $("clock-time").textContent = d.toLocaleTimeString(); $("clock-date").textContent = d.toDateString(); }
    if (!data) return;

    $("room").textContent = data.room;
    $("sub").textContent = data.subtitle;
    var gen = Date.parse(data.generated);
    var stale = data.date !== todayET() || t - gen > STALE_MIN * 60000;
    $("foot").textContent = "Updated " + fmt(data.generated) + (stale ? " · schedule may be out of date" : "");

    var B = data.bookings, cur = null, nxt = null, ni = -1;
    for (var i = 0; i < B.length; i++) {
      if (t >= B[i].s && t < B[i].e) cur = B[i];
      if (!nxt && B[i].s > t) { nxt = B[i]; ni = i; }
    }

    if (data.date !== todayET()) setState("off", "Unavailable", "Today's schedule hasn't loaded yet", "");
    else if (cur) setState("busy", "In use", "Until " + fmt(cur.end) + " · " + mins(cur.e - t) + " left", label(cur) + (cur.who ? " · " + cur.who : ""));
    else if (nxt && nxt.s - t <= SOON_MIN * 60000) setState("soon", "Starting soon", "Booked at " + fmt(nxt.start) + " · in " + mins(nxt.s - t), label(nxt));
    else setState("", "Available", nxt ? "Free until " + fmt(nxt.start) : "Free for the rest of the day", "");

    var up = (cur || !nxt || nxt.s - t > SOON_MIN * 60000) ? nxt : B[ni + 1];
    $("next").hidden = !up;
    if (up) { $("next-title").textContent = label(up); $("next-meta").textContent = range(up) + (up.who ? " · " + up.who : ""); }

    var html = "";
    for (var j = 0; j < B.length; j++) {
      var x = B[j], cls = t >= x.e ? "past" : (t >= x.s ? "now" : "");
      html += '<li class="' + cls + '"><div class="t">' + fmt(x.start) + "<span>to " + fmt(x.end) + '</span></div><div><div class="ev-title">' +
        (x.code ? '<span class="ev-code">' + esc(x.code) + "</span>" : "") + esc(x.title) + '</div><div class="ev-who">' + esc(x.who) + "</div></div></li>";
    }
    $("list").innerHTML = html || '<li class="empty">No events scheduled today</li>';
    $("count").textContent = B.length + (B.length === 1 ? " event" : " events");
  }

  load(); render();
  setInterval(render, 15000);
  setInterval(load, 60000);
  // Full reload every 6 hours picks up page changes and clears any browser drift.
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
})();
</script>
</body>
</html>
