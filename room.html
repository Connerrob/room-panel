<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Schedule</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
    />
    <style>
      [hidden] {
        display: none !important;
      }
      :root {
        --bg: #0f1418;
        --panel: #161d23;
        --line: #26313a;
        --fg: #eef2f4;
        --muted: #a7b4be;
        --free: #2fb67c;
        --busy: #e2574c;
        --soon: #e6a23c;
        --off: #4a5560;
        --uf: #fa4616;
        --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
        --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--body);
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        cursor: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 800px;
        transform-origin: 0 0;
        padding: 18px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }


      .sign {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 24px;
      }
      .status {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .room-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .room-code {
        font-family: var(--display);
        font-weight: 700;
        font-size: 64px;
        line-height: 0.95;
      }
      .room-sub {
        color: var(--muted);
        font-size: 20px;
        margin-top: 6px;
      }
      .clock {
        text-align: right;
        flex-shrink: 0;
      }
      .clock-time {
        font-family: var(--display);
        font-weight: 600;
        font-size: 44px;
        line-height: 1;
      }
      .clock-date {
        color: var(--muted);
        font-size: 19px;
        margin-top: 4px;
      }
      .state {
        border-radius: 6px;
        padding: 22px 28px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--free);
        color: #06140d;
        transition: background-color 0.6s;
      }
      .state.busy {
        background: var(--busy);
        color: #1a0705;
      }
      .state.soon {
        background: var(--soon);
        color: #1a1003;
      }
      .state.off {
        background: var(--off);
        color: var(--fg);
      }
      .state-label {
        font-family: var(--display);
        font-weight: 700;
        font-size: 56px;
        line-height: 0.95;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .state-detail {
        font-size: 27px;
        font-weight: 600;
      }
      .state-event {
        font-size: 23px;
        font-weight: 500;
        opacity: 0.9;
      }
      .next {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 18px 22px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .eyebrow {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 600;
      }
      .next-title {
        font-size: 27px;
        font-weight: 600;
      }
      .next-meta {
        color: var(--muted);
        font-size: 20px;
      }

      .schedule {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 20px 0 8px;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .schedule-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0 22px 12px;
        border-bottom: 1px solid var(--line);
      }
      .schedule-head h2 {
        margin: 0;
        font-family: var(--display);
        font-weight: 600;
        font-size: 32px;
      }
      .count {
        color: var(--muted);
        font-size: 18px;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
        scrollbar-width: thin;
        scrollbar-color: #3a4752 transparent;
      }
      ol::-webkit-scrollbar {
        width: 6px;
      }
      ol::-webkit-scrollbar-thumb {
        background: #3a4752;
        border-radius: 3px;
      }
      li {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        position: relative;
      }
      li:last-child {
        border-bottom: 0;
      }
      li.past {
        opacity: 0.45;
      }
      li.now {
        background: rgba(226, 87, 76, 0.12);
      }
      li.now::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--busy);
      }
      .t {
        font-weight: 600;
        font-size: 22px;
        line-height: 1.25;
      }
      .t span {
        display: block;
        color: var(--muted);
        font-weight: 500;
        font-size: 18px;
      }
      .ev-title {
        font-size: 23px;
        font-weight: 600;
        line-height: 1.25;
      }
      .ev-code {
        font-family: var(--display);
        font-weight: 600;
        color: var(--uf);
        margin-right: 6px;
      }
      .ev-who {
        color: var(--muted);
        font-size: 18px;
        margin-top: 3px;
      }
      .empty {
        display: block;
        padding: 24px 22px;
        color: var(--muted);
        font-size: 22px;
      }
      .more {
        position: absolute;
        left: 1px;
        right: 1px;
        bottom: 30px;
        height: 64px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        background: linear-gradient(rgba(22, 29, 35, 0), var(--panel) 80%);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        pointer-events: none;
        font-size: 16px;
      }
      .foot {
        padding: 10px 22px 4px;
        color: var(--muted);
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <main class="sign">
        <section class="status">
          <div class="room-head">
            <div>
              <div class="room-code" id="room">&nbsp;</div>
              <div class="room-sub" id="sub"></div>
            </div>
            <div class="clock">
              <div class="clock-time" id="clock-time"></div>
              <div class="clock-date" id="clock-date"></div>
            </div>
          </div>
          <div class="state off" id="state">
            <div class="state-label" id="state-label">Loading</div>
            <div class="state-detail" id="state-detail"></div>
            <div class="state-event" id="state-event"></div>
          </div>
          <div class="next" id="next" hidden>
            <div class="eyebrow">Up next</div>
            <div class="next-title" id="next-title"></div>
            <div class="next-meta" id="next-meta"></div>
          </div>
        </section>
        <section class="schedule">
          <div class="schedule-head">
            <h2>Today</h2>
            <span class="count" id="count"></span>
          </div>
          <ol id="list"></ol>
          <div class="more" id="more" hidden>Swipe for more ▾</div>
          <div class="foot" id="foot"></div>
        </section>
      </main>
    </div>
    <script>
      (function () {

        // Which room to show comes from the URL: room.html?room=cse-e222 loads cse-e222.json
        var ROOM = (location.search.match(/[?&]room=([\w-]+)/) || [])[1] || "";
        var FILE = "json/" + ROOM + ".json";
        var RELOAD_MIN = 2; // full page reload 
        var DATA_SEC = 60; // reload schedule data
        var SNAP_SEC = 60; // after scrolling, jump back to "now"
        var SOON_MIN = 15,
          STALE_MIN = 90;

        var data = null,
          lastTouch = 0;
        function $(id) {
          return document.getElementById(id);
        }

        function fit() {
          var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800),
            el = document.querySelector(".stage");
          el.style.transform = "scale(" + s + ")";
          el.style.left = (window.innerWidth - 1280 * s) / 2 + "px";
          el.style.top = (window.innerHeight - 800 * s) / 2 + "px";
        }
        window.addEventListener("resize", fit);
        fit();

        function esc(s) {
          return String(s || "").replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        function fmt(iso) {
          var h = +iso.substr(11, 2),
            m = iso.substr(14, 2);
          return (h % 12 || 12) + ":" + m + " " + (h >= 12 ? "PM" : "AM");
        }
        function range(b) {
          var s = fmt(b.start),
            e = fmt(b.end);
          if (s.slice(-2) === e.slice(-2)) s = s.slice(0, -3);
          return s + " – " + e;
        }
        function mins(ms) {
          var m = Math.round(ms / 60000);
          if (m < 60) return m + " min";
          var h = Math.floor(m / 60),
            r = m % 60;
          return h + " hr" + (r ? " " + r + " min" : "");
        }
        function label(b) {
          return (b.code ? b.code + " " : "") + b.title;
        }
        function todayET() {
          try {
            return new Date().toLocaleDateString("en-CA", {
              timeZone: "America/New_York",
            });
          } catch (e) {
            var d = new Date();
            return (
              d.getFullYear() +
              "-" +
              ("0" + (d.getMonth() + 1)).slice(-2) +
              "-" +
              ("0" + d.getDate()).slice(-2)
            );
          }
        }

        function load() {
          if (!ROOM) {
            data = { error: "No room set. Add ?room=<room> to the URL, e.g. room.html?room=cse-e222" };
            render();
            return;
          }
          var x = new XMLHttpRequest();
          x.open("GET", FILE + "?_=" + Date.now());
          x.onload = function () {
            if (x.status !== 200) {
              data = { error: "Couldn't load " + FILE + " (HTTP " + x.status + ")" };
              render();
              return;
            }
            try {
              var d = JSON.parse(x.responseText);
              d.bookings.sort(function (a, b) {
                return a.start < b.start ? -1 : 1;
              });
              d.bookings.forEach(function (b) {
                b.s = Date.parse(b.start);
                b.e = Date.parse(b.end);
              });
              data = d;
            } catch (e) {
              data = { error: FILE + " has an error: " + (e.message || e) };
            }
            render();
          };
          x.onerror = function () {
            data = { error: "Couldn't reach " + FILE };
            render();
          };
          x.send();
        }

        function stateOf(d, t) {
          if (!d || d.error) return { cls: "off" };
          if (d.date !== todayET()) return { cls: "off", stale: true };
          var B = d.bookings,
            cur = null,
            nxt = null,
            ni = -1;
          for (var i = 0; i < B.length; i++) {
            if (t >= B[i].s && t < B[i].e) cur = B[i];
            if (!nxt && B[i].s > t) {
              nxt = B[i];
              ni = i;
            }
          }
          var cls = cur
            ? "busy"
            : nxt && nxt.s - t <= SOON_MIN * 60000
              ? "soon"
              : "free";
          return { cls: cls, cur: cur, nxt: nxt, ni: ni };
        }

        function setState(cls, l, d, e) {
          $("state").className = "state " + cls;
          $("state-label").textContent = l;
          $("state-detail").textContent = d;
          $("state-event").textContent = e;
        }

        function render() {
          var t = Date.now(),
            now = new Date();
          try {
            $("clock-time").textContent = now.toLocaleTimeString("en-US", {
              hour: "numeric",
              minute: "2-digit",
              timeZone: "America/New_York",
            });
            $("clock-date").textContent = now.toLocaleDateString("en-US", {
              weekday: "long",
              month: "short",
              day: "numeric",
              timeZone: "America/New_York",
            });
          } catch (e) {
            $("clock-time").textContent = now.toLocaleTimeString();
            $("clock-date").textContent = now.toDateString();
          }

          var d = data;
          if (!d) {
            setState("off", "Loading", "", "");
            return;
          }
          if (d.error) {
            setState("off", "No data", d.error, "");
            $("room").textContent = ROOM ? ROOM.toUpperCase().replace("-", " ") : "No room";
            $("sub").textContent = "";
            $("list").innerHTML = "";
            $("count").textContent = "";
            $("next").hidden = true;
            $("foot").textContent = "";
            updateMore();
            return;
          }

          $("room").textContent = d.room;
          $("sub").textContent = d.subtitle;
          var stale =
            d.date !== todayET() ||
            t - Date.parse(d.generated) > STALE_MIN * 60000;
          $("foot").textContent = "Updated " + fmt(d.generated);

          var st = stateOf(d, t),
            B = d.bookings,
            c = st.cur,
            n = st.nxt;
          if (st.stale)
            setState(
              "off",
              "Unavailable",
              "Today's schedule hasn't loaded yet",
              "",
            );
          else if (c)
            setState(
              "busy",
              "In use",
              "Until " + fmt(c.end) + " · " + mins(c.e - t) + " left",
              label(c) + (c.who ? " · " + c.who : ""),
            );
          else if (st.cls === "soon")
            setState(
              "soon",
              "Starting soon",
              "Booked at " + fmt(n.start) + " · in " + mins(n.s - t),
              label(n),
            );
          else
            setState(
              "",
              "Available",
              n ? "Free until " + fmt(n.start) : "Free for the rest of the day",
              "",
            );

          var up = c || !n || st.cls !== "soon" ? n : B[st.ni + 1];
          $("next").hidden = !up || st.stale;
          if (up) {
            $("next-title").textContent = label(up);
            $("next-meta").textContent =
              range(up) + (up.who ? " · " + up.who : "");
          }

          var html = "";
          for (var j = 0; j < B.length; j++) {
            var x = B[j],
              cls = t >= x.e ? "past" : t >= x.s ? "now" : "";
            html +=
              '<li class="' +
              cls +
              '"><div class="t">' +
              fmt(x.start) +
              "<span>to " +
              fmt(x.end) +
              '</span></div><div><div class="ev-title">' +
              (x.code
                ? '<span class="ev-code">' + esc(x.code) + "</span>"
                : "") +
              esc(x.title) +
              '</div><div class="ev-who">' +
              esc(x.who) +
              "</div></div></li>";
          }
          var ol = $("list"),
            keep = ol.scrollTop;
          ol.innerHTML =
            html || '<li class="empty">No events scheduled today</li>';
          if (Date.now() - lastTouch < SNAP_SEC * 1000) ol.scrollTop = keep;
          else {
            var first = ol.querySelector("li:not(.past)");
            ol.scrollTop = first
              ? first.offsetTop - ol.offsetTop
              : ol.scrollHeight;
          }
          $("count").textContent =
            B.length + (B.length === 1 ? " event" : " events");
          updateMore();
        }

        function updateMore() {
          var ol = $("list");
          $("more").hidden =
            ol.scrollTop + ol.clientHeight >= ol.scrollHeight - 4;
        }
        $("list").addEventListener("scroll", updateMore, { passive: true });
        ["touchstart", "pointerdown", "wheel"].forEach(function (ev) {
          $("list").addEventListener(
            ev,
            function () {
              lastTouch = Date.now();
            },
            { passive: true },
          );
        });

        load();
        render();
        setInterval(render, 5000);
        setInterval(load, DATA_SEC * 1000);
        setTimeout(function () {
          var q = location.search.replace(/[?&]v=\d+/, "").replace(/^&/, "?");
          location.replace(
            location.pathname +
              (q ? q + "&" : "?") +
              "v=" +
              Date.now(),
          );
        }, RELOAD_MIN * 60000);
      })();
    </script>
  </body>
</html>
